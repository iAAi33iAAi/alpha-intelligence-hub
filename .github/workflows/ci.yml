name: Alpha Intelligence Hub Scaffold CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold:
    name: Validate repository scaffold
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YAML parser for scaffold contract tests
        run: python -m pip install --disable-pip-version-check "PyYAML>=6,<7"

      - name: Verify shell migration script syntax
        run: bash -n init-hub.sh

      - name: Run scaffold contract tests
        run: python -m unittest discover -s tests -v
